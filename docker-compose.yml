services:
  php-framework-php:
    container_name: php-framework
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/var/www/html
      - ./log:/var/log/apache2/
    ports:
      - 8181:80

# Ayant des difficultés avec mon port 8080, j'ai modifié vers le port 8181 :)
